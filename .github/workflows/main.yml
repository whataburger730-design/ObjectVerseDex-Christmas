
name: Build Christmas Calendar EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download game files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Windows game
        run: npx electron-builder --win portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload finished game
        uses: actions/upload-artifact@v4
        with:
          name: ObjectVerseDex-Christmas-Windows
          path: dist/*.exe
          if-no-files-found: error
